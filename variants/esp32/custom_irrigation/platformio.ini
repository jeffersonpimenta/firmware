[env:custom_irrigation]
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = PRIVATE_HW
custom_meshtastic_architecture = esp32
custom_meshtastic_actively_supported = false
custom_meshtastic_display_name = Custom Irrigation (Heltec V2 seed)
custom_meshtastic_tags = Irrigation

board_level = extra
extends = esp32_base
board = heltec_wifi_lora_32_V2
build_unflags =
  ${esp32_base.build_unflags}
  -DMESHTASTIC_EXCLUDE_WEBSERVER=1
build_flags =
  ${esp32_base.build_flags}
  -D HELTEC_V2_0
  -D CUSTOM_IRRIGATION
  -I variants/esp32/custom_irrigation
  -D MESHTASTIC_EXCLUDE_MQTT=1
  -D MESHTASTIC_PORTAL_HTTP_ONLY=1
build_src_filter =
  ${esp32_base.build_src_filter}
  +<mesh/http/>
lib_deps =
  ${esp32_base.lib_deps}
  # renovate: datasource=git-refs depName=meshtastic-esp32_https_server packageName=https://github.com/meshtastic/esp32_https_server gitBranch=master
  https://github.com/meshtastic/esp32_https_server/archive/0c71f380390ad483ff134ad938e07f6cf1226c5b.zip

; ---------------------------------------------------------------------------
; Env de PRODUCAO WROOM: mesh-core + portal HTTP, sem BLE/tela/modulos/admin/
; serial/MQTT/GPS. Config meshtastic baked no variant.h (USERPREFS). Ver spec
; 2026-11-24-irrigacao-wroom-mesh-core-design.md.
; ---------------------------------------------------------------------------
[env:custom_irrigation_wroom]
extends = env:custom_irrigation
build_flags =
  ${env:custom_irrigation.build_flags}
  -D MESHTASTIC_EXCLUDE_BLUETOOTH=1
  -D MESHTASTIC_EXCLUDE_SCREEN=1
  -D HAS_SCREEN=0
  -D MESHTASTIC_EXCLUDE_MODULES=1
  -D MESHTASTIC_EXCLUDE_ADMIN=1
  -D MESHTASTIC_EXCLUDE_SERIAL=1
  -D MESHTASTIC_EXCLUDE_INPUTBROKER=1
  -D MESHTASTIC_EXCLUDE_GPS=1
  -Wl,--print-memory-usage
custom_sdkconfig =
  ${esp32_base.custom_sdkconfig}
  CONFIG_BT_ENABLED=n
  CONFIG_BT_NIMBLE_ENABLED=n
  CONFIG_BT_CONTROLLER_ENABLED=n
