<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portal de Irrigação</title>
  <link rel="stylesheet" href="/irrigacao/style.css" />
</head>
<body class="field-portal">
  <header><h1>Portal do Nó</h1><span id="apLeft" class="muted"></span></header>
  <nav class="tabs">
    <button data-tab="node" class="active">Este nó</button>
    <button data-tab="net">Rede</button>
    <button data-tab="svcclients" class="svc-only hidden">Clientes</button>
    <button data-tab="svcnet" class="svc-only hidden">Rede (cliente)</button>
    <button data-tab="svclog" class="svc-only hidden">Log serviço</button>
  </nav>

  <section id="tab-node" class="tab">
    <div id="nodeState" class="card">Carregando…</div>
    <div id="sensorsCard" class="card">
      <h2>Sensores</h2>
      <div id="sensorsList" class="muted">—</div>
    </div>
    <div id="gposCard" class="card hidden">
      <h2>Saídas (GPO)</h2>
      <div id="gposList"></div>
      <span id="gpoMsg" class="muted"></span>
    </div>
    <div id="logCard" class="card">
      <h2>Auditoria <button type="button" id="logRefresh">Atualizar</button></h2>
      <div id="logList" class="muted">—</div>
    </div>
    <form id="coordsForm" class="card">
      <h2>Coordenadas locais</h2>
      <label>Latitude <input type="number" id="coordLat" step="0.0000001" value="0" /></label>
      <label>Longitude <input type="number" id="coordLon" step="0.0000001" value="0" /></label>
      <button type="submit">Salvar</button>
      <span id="coordMsg" class="muted"></span>
    </form>
    <form id="pulseForm" class="card">
      <h2>Teste de pulso</h2>
      <label>Válvula <input type="number" id="pulseValve" min="0" max="7" value="0" /></label>
      <label>Duração (s) <input type="number" id="pulseDur" min="1" max="7200" value="10" /></label>
      <button type="submit">Abrir</button>
      <span id="pulseMsg" class="muted"></span>
    </form>
  </section>

  <section id="tab-net" class="tab hidden">
    <form id="netForm" class="card">
      <h2>Comandar zona (via gateway)</h2>
      <label>Zona <select id="netZone"></select></label>
      <label>Ação
        <select id="netAction"><option value="open">Abrir</option><option value="close">Fechar</option></select>
      </label>
      <label>Duração (s) <input type="number" id="netDur" min="1" max="7200" value="300" /></label>
      <button type="submit">Enviar</button>
      <span id="netMsg" class="muted"></span>
    </form>
  </section>

  <!-- Fase 8c — abas do device SERVICO (§11.8), reveladas por app.js quando role==Serviço. -->
  <section id="tab-svcclients" class="tab hidden">
    <div class="card">
      <h2>Clientes do cofre</h2>
      <div id="clientsList" class="muted">—</div>
      <span id="clientsMsg" class="muted"></span>
    </div>
    <div class="card">
      <h2>Import / Export (§11.7)</h2>
      <button type="button" id="exportBtn">Exportar cofre (.json)</button>
      <hr />
      <input type="file" id="importFile" accept="application/json" />
      <button type="button" id="importBtn">Importar (merge)</button>
      <button type="button" id="importReplaceBtn">Importar (substituir)</button>
    </div>
  </section>

  <section id="tab-svcnet" class="tab hidden">
    <div class="card">
      <h2>Rede do cliente ativo <button type="button" id="svcScanBtn">Varredura</button></h2>
      <div id="svcNodes" class="muted">—</div>
      <span id="svcnetMsg" class="muted"></span>
    </div>
    <div class="card">
      <h2>Editor de config</h2>
      <div id="cfgEditor" class="hidden"></div>
      <span id="cfgMsg" class="muted"></span>
    </div>
  </section>

  <section id="tab-svclog" class="tab hidden">
    <div class="card">
      <h2>Log de serviço <button type="button" id="svcLogRefresh">Atualizar</button></h2>
      <div id="svcLogList" class="muted">—</div>
    </div>
  </section>

  <script src="/irrigacao/portal/app.js"></script>
</body>
</html>
